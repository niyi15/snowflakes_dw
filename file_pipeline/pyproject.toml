[project]
name = "file-pipeline"
version = "0.1.0"
requires-python = ">=3.10,<3.15"
dependencies = ["dagster", "dagster-cloud"]

[project.optional-dependencies]
dev = ["dagster-webserver"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["file_pipeline*"]

[tool.dagster]
module_name = "file_pipeline.definitions"
code_location_name = "file_pipeline"
